# One appliance: FastAPI + LangGraph + Qwen. OpenAI is not used.
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# First start downloads ~2.8 GB of model weights into the qwen-models volume.
# Ollama is not published; the browser only talks to the app.

name: mortgage-payment-check

services:
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - qwen-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model-pull:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["hf.co/empero-ai/Qwen3.8-4B-Distill-GGUF:Q4_K_M"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: hf.co/empero-ai/Qwen3.8-4B-Distill-GGUF:Q4_K_M
      DISSEQT_TRANSPORT: local
      UC1_STORAGE_ROOT: /state
      UC1_WORKER_TOKEN: ${UC1_WORKER_TOKEN:-}
    volumes:
      - payment-audit:/state
    depends_on:
      model-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  qwen-models:
  payment-audit:
